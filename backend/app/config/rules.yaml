rules:
  - rule_id: COVER_TITLE_ALIGNMENT
    category: cover
    severity: error
    description: 标题应填写完整，且位于封面居中位置
  - rule_id: ENGLISH_TITLE_REQUIRED
    category: title
    severity: warning
    description: 英文题目应存在且与中文题目一致
  - rule_id: KEYWORDS_COUNT
    category: abstract
    severity: warning
    description: 关键词个数建议控制在3-5个
  - rule_id: ABSTRACT_LENGTH_CHECK
    category: abstract
    severity: warning
    description: 中文摘要应至少达到500字
  - rule_id: SECTION_LEVELING
    category: section
    severity: warning
    description: 章/节/小节层级必须符合规范
  - rule_id: CHAPTER_SUMMARY_REQUIRED
    category: chapter
    severity: warning
    description: 从第2章开始应写本章小结
  - rule_id: SUMMARY_SECTION
    category: conclusion
    severity: warning
    description: 应包含总结与展望章节
  - rule_id: BIBLIOGRAPHY_HEADING
    category: bibliography
    severity: warning
    description: 参考文献应作为单独章节出现
  - rule_id: REFERENCE_SEQUENCE
    category: bibliography
    severity: error
    description: 参考文献编号必须从[1]开始并按顺序连续
  - rule_id: REFERENCES_MINIMUM_COUNT
    category: bibliography
    severity: warning
    description: 至少应有15篇参考文献
  - rule_id: DOI_REMOVAL
    category: bibliography
    severity: warning
    description: 参考文献中不应保留 DOI
  - rule_id: FIGURE_CAPTION_FORMAT
    category: figure
    severity: error
    description: 图序应为“图X-X”并位于图下方
  - rule_id: TABLE_CAPTION_FORMAT
    category: table
    severity: error
    description: 表序应为“表X-X”并位于表上方
  - rule_id: STYLE_FONT
    category: style
    severity: warning
    description: 字体应符合论文模板要求
  - rule_id: STYLE_ALIGNMENT
    category: style
    severity: warning
    description: 段落对齐方式应符合规范
  - rule_id: FRONT_MATTER_PAGE_NUMBER
    category: pagination
    severity: error
    description: 摘要和目录页码应采用大写罗马数字
  - rule_id: PAGE_NUMBERING_ARABIC_BODY
    category: pagination
    severity: error
    description: 正文页码应采用阿拉伯数字
